<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قالب شرائح مسك</title>
  <link rel="stylesheet" href="slides.css">
</head>
<body>
  <!-- قالب شرائح 16:9 بهوية مسك. انسخ الشريحة التي تحتاجها وغيّر نصها، ثم اطبع إلى PDF (بلا هوامش، مع ألوان الخلفية). -->

  <section class="slide slide-title">
    <div class="band" aria-hidden="true"></div>
    <div class="text">
      <h1>مسك ديزاين</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="tagline">يُرسم اسمك ثم يُحفر</p>
    </div>
    <img class="lockup" src="../../brand/misk/misk-lockup.svg" alt="مسك ديزاين">
  </section>

  <section class="slide slide-content">
    <h2>عنوان الشريحة</h2>
    <div class="rule" aria-hidden="true"></div>
    <ul>
      <li>اذكر الخامة باسمها الصحيح؛ جلد طبيعي نباتي الدباغة، خشب، أكريليك.</li>
      <li>ابدأ بالاسم أو المناسبة ثم القطعة؛ فالعميل يشتري ما يُهدى لا ما يُحفر.</li>
      <li>حدّد العدد والمقاس وموعد الاستلام بأرقام واضحة في كل عرض وتأكيد.</li>
    </ul>
    <img class="mark" src="../../brand/misk/misk-mark.svg" alt="">
    <p class="page">٢</p>
  </section>
</body>
</html>
