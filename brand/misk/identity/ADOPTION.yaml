token_map:
- app_var: --bg
  light:
    role: bg
    var: --misk-bg
    value: '#f8f2e9'
  dark:
    role: bg
    var: --misk-bg
    value: '#1f1518'
- app_var: --surface
  light:
    role: surface
    var: --misk-surface
    value: '#fdf2f5'
  dark:
    role: surface
    var: --misk-surface
    value: '#312529'
- app_var: --ink
  light:
    role: text
    var: --misk-text
    value: '#35242c'
  dark:
    role: text
    var: --misk-text
    value: '#fdf2f5'
- app_var: --muted
  light:
    role: text-muted
    var: --misk-text-muted
    value: '#6c5c61'
  dark:
    role: text-muted
    var: --misk-text-muted
    value: '#c4b6ba'
- app_var: --line
  light:
    role: border
    var: --misk-border
    value: '#ddd0d4'
  dark:
    role: border
    var: --misk-border
    value: '#5d4e53'
- app_var: --accent
  light:
    role: brand
    var: --misk-brand
    value: '#68112f'
  dark:
    role: brand-strong
    var: --misk-brand-strong
    value: '#e4a8b3'
- app_var: --risk
  light:
    role: error
    var: --misk-error
    value: '#76021a'
  dark:
    role: error
    var: --misk-error
    value: '#ff9a99'
checks:
- id: color-parity
  section: color
  ok: true
  detail: كل المتغيرات اللونية النهارية مطابقة
- id: font-family
  section: type
  ok: true
  detail: عائلة Cairo مذكورة في أنماط المشروع
- id: motion-included
  section: motion
  ok: true
  detail: ظهور الرمز مضمَّن
- id: slide-templates
  section: applications
  ok: true
  detail: قوالب الشرائح موجودة
- id: splash-screen
  section: applications
  ok: true
  detail: شاشة الافتتاح موجودة
- id: token-parity-test
  section: tokens
  ok: true
  detail: اختبار تطابق الرموز مع ADOPTION.yaml موجود
- id: icons-used
  section: icons
  ok: false
  detail: '0 من 9 أيقونة مستعملة في الواجهة؛ غير المستعملة: acrylic، delivery، favors، laser-engrave، leather، name، order،
    phone-case، portrait'
  action: استعمل أيقونات identity/icons كما هي حيث تعرض الواجهة معناها؛ ما لا موضع له في التطبيق يُذكر للمالك ولا يُحشر.
- id: pattern-used
  section: pattern
  ok: false
  detail: النمط غير مستعمل في الواجهة
  action: ضع identity/patterns/motif-*.svg في الصفحات حيث تضعه شاشات identity/screens.
- id: screens-compared
  section: applications
  ok: true
  detail: اختبار يقارن صفحات المشروع بشاشات الدليل موجود
gaps:
- icons-used
- pattern-used
