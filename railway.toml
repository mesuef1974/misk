# إعداد خدمة الويب على Railway (لا قيم أسرار هنا؛ المتغيرات في اللوحة).
# preDeploy: مرة واحدة لكل نشر (هجرات) قبل أن تستقبل أي نسخة حركة.
# start: لكل نسخة (collectstatic في قرصها المحلي ثم gunicorn).
# خدمة العامل (Celery) تُنشأ من المستودع نفسه بأمر بدء: bash scripts/railway-worker.sh

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["bash", "scripts/railway-predeploy.sh"]
startCommand = "bash scripts/railway-release.sh"
healthcheckPath = "/health/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
