name: بوابة الجودة

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled: وسم «نشر-عاجل» يغيّر حكم نافذة النشر فيُعاد الفحص.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: config.settings.testing
  SECRET_KEY: ci-testing-only  # pragma: allowlist secret
  DATABASE_URL: postgres://app:app@localhost:5432/app  # pragma: allowlist secret

jobs:
  lint:
    name: ruff + format + secrets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - name: detect-secrets على ما تغيّر
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          files=$(git diff --name-only "$base"...HEAD -- . ':!frontend/package-lock.json' | xargs -r ls 2>/dev/null || true)
          [ -z "$files" ] || detect-secrets scan $files | python -c "import json,sys; r=json.load(sys.stdin)['results']; print(r); sys.exit(1 if r else 0)"

  backend:
    name: pytest + تغطية + هجرات
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }  # pragma: allowlist secret
        ports: ["5432:5432"]  # pragma: allowlist secret
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov --cov-report=term-missing

  frontend:
    name: Vue typecheck + vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-window:
    # الاسم يطابق JOB_NAME في scripts/deploy_window.py: التحديث المجدوَل يجد الفحص به.
    name: نافذة النشر
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with:
          # في الطلب: السكربت من فرع الأساس لا من رأس الطلب، وإلا عدّله طلب ليتجاوزه.
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
      - env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy_window.py

  gate:
    name: بوابة الجودة
    needs: [lint, backend, frontend, deploy-window]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: الحكم
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "
          import json,sys; needs=json.load(sys.stdin)
          bad=[k for k,v in needs.items() if v['result'] not in ('success','skipped')]
          print('فشل:',bad) if bad else print('كل الفحوص خضراء'); sys.exit(1 if bad else 0)"
