name: بوابة الجودة

on:
  pull_request:
    branches: [main]
  # يعمل على إيداع الدمج في main: Railway ينشره بعد نجاح هذه الحزمة وحدها (checkSuites في .railway/railway.ts).
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  # لا يُلغى تشغيل على main: الحزمة الملغاة تُسقط نشر إيداعها.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  DJANGO_SETTINGS_MODULE: config.settings.testing
  SECRET_KEY: ci-testing-only  # pragma: allowlist secret
  DATABASE_URL: postgres://app:app@localhost:5432/app  # pragma: allowlist secret

jobs:
  lint:
    name: ruff + format + secrets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - name: detect-secrets على ما تغيّر
        run: |
          set -o pipefail
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}"
          # before كله أصفار حين يُنشأ الفرع: لا أساس للمقارنة.
          case "$base" in ''|*[!0]*) ;; *) base='' ;; esac
          [ -n "$base" ] || { echo "لا أساس للمقارنة في هذا الحدث"; exit 0; }
          # -z: الأسماء العربية وذات المسافات تصل كما هي. pipefail: انهيار git أو الماسح يُفشل الفحص ولا يمرّ صامتًا.
          git diff -z --name-only --diff-filter=d "$base"...HEAD -- . ':!frontend/package-lock.json' \
            | xargs -0 -r detect-secrets scan \
            | python -c "import json,sys; raw=sys.stdin.read(); r=json.loads(raw)['results'] if raw.strip() else {}; print(r); sys.exit(1 if r else 0)"

  backend:
    name: pytest + تغطية + هجرات
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }  # pragma: allowlist secret
        ports: ["5432:5432"]  # pragma: allowlist secret
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov --cov-report=term-missing

  frontend:
    name: Vue typecheck + vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  gate:
    name: بوابة الجودة
    needs: [lint, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: الحكم
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "
          import json,sys; needs=json.load(sys.stdin)
          bad=[k for k,v in needs.items() if v['result'] not in ('success','skipped')]
          print('فشل:',bad) if bad else print('كل الفحوص خضراء'); sys.exit(1 if bad else 0)"
