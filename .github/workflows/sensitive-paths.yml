name: المسارات الحسّاسة

# يوسم الطلب الذي يمسّ مسارًا حسّاسًا (من قائمة فرع الأساس) بوسم مراجعة أمنية. لا يحجب بنفسه؛ الحجب في merge_gate.py.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: فحص ووسم
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, re, subprocess
          base, pr = os.environ["BASE"], os.environ["PR"]
          rules = json.loads(subprocess.check_output(["git", "show", f"origin/{base}:security/sensitive_paths.json"], text=True))
          # --no-renames: المسار القديم والجديد معًا، فإعادة التسمية لا تخفي مسارًا حسّاسًا. -z: الأسماء العربية وذات المسافات كما هي.
          diff = subprocess.check_output(["git", "diff", "--no-renames", "-z", "--name-only", f"origin/{base}...HEAD"], text=True, encoding="utf-8")
          changed = [p for p in diff.split("\0") if p]
          hits = {cat: [p for p in changed if any(fnmatch.fnmatch(p, g) for g in globs)]
                  for cat, globs in rules["mandatory_review_when_diff_touches"].items()}
          # الأسطر المضافة وحدها تُطابَق بأنماط المحتوى (أسرار، Django غير آمن)، وكل نمط يوسم ملفه.
          # core.quotePath=false: لا يقتبس git الأسماء العربية بالثماني، فلا يتخطّاها فحص المحتوى (د6).
          patch = subprocess.check_output(["git", "-c", "core.quotePath=false", "diff", "--no-renames", "--no-color", "-U0", f"origin/{base}...HEAD"], text=True, encoding="utf-8", errors="replace")
          content = {cat: [re.compile(p) for p in pats] for cat, pats in rules.get("mandatory_review_when_diff_content_matches", {}).items()}

          def target(line):
              # ما بقي مقتبسًا (تنصيص أو محرف تحكّم في الاسم) يُفكّ ولا يُتخطّى؛ /dev/null وحده بلا هدف.
              # git يُلحق TAB بالاسم ذي المسافة غير المقتبس؛ الاسم الذي فيه TAB فعلًا يُقتبس فلا يُمسّ.
              name = line[4:].removesuffix("\t")
              if len(name) > 1 and name[0] == name[-1] == '"':
                  raw = name[1:-1]
                  try:
                      name = raw.encode("utf-8").decode("unicode_escape").encode("latin-1").decode("utf-8")
                  except (UnicodeError, ValueError):
                      name = raw
              return name[2:] if name.startswith("b/") else None

          current = None
          for line in patch.splitlines():
              if line.startswith("+++ "):
                  current = target(line)
              elif line.startswith("+") and current:
                  for cat, pats in content.items():
                      if any(p.search(line[1:]) for p in pats) and current not in hits.setdefault(cat, []):
                          hits[cat].append(current)
          hits = {k: v for k, v in hits.items() if v}
          if hits:
              body = "مراجعة أمنية إلزامية — مسارات حسّاسة:\n" + "\n".join(f"- {k}: " + ", ".join(v) for k, v in hits.items())
              subprocess.run(["gh", "pr", "edit", pr, "--add-label", "مراجعة-أمنية"], check=False)
              subprocess.run(["gh", "pr", "comment", pr, "--body", body], check=True)
              print(body)
          else:
              print("لا مسارات حسّاسة")
          PY
