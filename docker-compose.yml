services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: misk
      POSTGRES_PASSWORD: misk
      POSTGRES_DB: misk
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misk"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://misk:misk@db:5432/misk
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECURE_SSL_REDIRECT: "0"
      PORT: "8000"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "bash scripts/railway-predeploy.sh && bash scripts/railway-release.sh"

volumes:
  pgdata:
